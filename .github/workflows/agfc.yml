name: Pull AGFC reports

on:
  schedule:
    # Thursdays 6pm UTC — fishing reports land Thursday
    - cron: "0 18 * * 4"
    # Wednesdays 9pm UTC — waterfowl reports land Wednesday afternoon in season
    - cron: "0 21 * * 3"
  workflow_dispatch:      # lets you run it by hand from the Actions tab

jobs:
  pull:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch fishing report
        run: node fetch.js fishing

      - name: Fetch waterfowl report
        run: node fetch.js waterfowl
        continue-on-error: true   # not published outside duck season

      - name: Commit any changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "AGFC data $(date -u +%Y-%m-%d)"
          git push
