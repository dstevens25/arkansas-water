name: Pull AGFC reports

on:
  schedule:
    - cron: "0 18 * * 4"
    - cron: "0 21 * * 3"
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch fishing report
        run: node fetch.js fishing

      - name: Fetch waterfowl conditions
        run: node waterfowl.js
        continue-on-error: true

      - name: Commit any changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "AGFC data $(date -u +%Y-%m-%d)"
          git push
