name: Pull AGFC reports

on:
  schedule:
    # Thursdays 6pm UTC — AGFC fishing reports land Thursday
    - cron: "0 18 * * 4"
    # Wednesdays 9pm UTC — waterfowl reports land Wednesday afternoon in season
    - cron: "0 21 * * 3"
    # Gauge alerts: twice daily
    - cron: "0 5,16 * * *"
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write          # needed so the alert can open an issue
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch fishing report
        run: node fetch.js fishing
        continue-on-error: true

      - name: Fetch waterfowl conditions
        run: node waterfowl.js
        continue-on-error: true

      - name: Check gauge alerts
        run: node alerts.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Commit any changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "AGFC data $(date -u +%Y-%m-%d)"
          git push
